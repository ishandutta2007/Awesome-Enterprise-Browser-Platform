<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0" />
    </linearGradient>

    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.5" />
    </filter>

    <style>
      .title {
        font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        font-weight: 800;
        font-size: 46px;
        fill: #ffffff;
      }
      .subtitle {
        font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        font-weight: 500;
        font-size: 20px;
        fill: #cbd5e1;
      }
      .tag {
        font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        font-weight: 600;
        font-size: 13px;
        fill: #93c5fd;
      }
      .badge-text {
        font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        font-weight: 600;
        font-size: 12px;
        fill: #e2e8f0;
      }
      
      @keyframes floatSlow {
        0% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-12px) rotate(1deg); }
        100% { transform: translateY(0px) rotate(0deg); }
      }

      @keyframes pulseGlow {
        0% { opacity: 0.3; transform: scale(1); }
        50% { opacity: 0.6; transform: scale(1.05); }
        100% { opacity: 0.3; transform: scale(1); }
      }

      @keyframes strokeDash {
        0% { stroke-dashoffset: 1000; }
        100% { stroke-dashoffset: 0; }
      }

      .floating-card {
        animation: floatSlow 6s ease-in-out infinite;
      }

      .pulse-bg {
        transform-origin: center;
        animation: pulseGlow 8s ease-in-out infinite;
      }

      .flow-line {
        stroke-dasharray: 10 15;
        animation: strokeDash 30s linear infinite;
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="340" rx="16" fill="url(#bgGrad)" />

  <!-- Dynamic Glowing Orbs in Background -->
  <circle class="pulse-bg" cx="200" cy="90" r="180" fill="url(#glowGrad)" />
  <circle class="pulse-bg" cx="1000" cy="250" r="220" fill="url(#glowGrad)" style="animation-delay: -4s;" />

  <!-- Decorative Flow / Network Lines (Background layer) -->
  <path class="flow-line" d="M 50 280 Q 300 320 550 240 T 1150 180" fill="none" stroke="#475569" stroke-width="2" opacity="0.4" />
  <path class="flow-line" d="M 100 60 Q 400 120 750 40 T 1100 120" fill="none" stroke="#6366f1" stroke-width="1.5" opacity="0.3" />

  <!-- Background Dynamic Interactive Pill / Card Elements (Lower Z-Index, background only) -->
  <g class="floating-card" opacity="0.25">
    <rect x="860" y="40" width="280" height="70" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    <circle cx="890" cy="75" r="14" fill="#10b981" opacity="0.8" />
    <rect x="915" y="62" width="140" height="10" rx="5" fill="#475569" />
    <rect x="915" y="78" width="90" height="8" rx="4" fill="#334155" />
  </g>

  <g class="floating-card" style="animation-delay: -3s;" opacity="0.25">
    <rect x="890" y="210" width="250" height="80" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    <circle cx="925" cy="250" r="16" fill="#6366f1" opacity="0.8" />
    <rect x="955" y="238" width="120" height="10" rx="5" fill="#475569" />
    <rect x="955" y="254" width="80" height="8" rx="4" fill="#334155" />
  </g>

  <!-- FOREGROUND CONTENT - HIGH VISIBILITY & ACCESSIBILITY -->
  <!-- Top Pill / Category Tag -->
  <g transform="translate(60, 45)">
    <rect x="0" y="0" width="270" height="32" rx="16" fill="#1e293b" stroke="#475569" stroke-width="1" />
    <circle cx="16" cy="16" r="6" fill="#10b981" />
    <text x="32" y="21" class="tag">⚡ CURATED ENTERPRISE ECOSYSTEM</text>
  </g>

  <!-- Title Text -->
  <text x="60" y="130" class="title" filter="url(#shadow)">Enterprise Browser Platform</text>
  
  <!-- Gradient Accent Bar -->
  <rect x="60" y="152" width="480" height="5" rx="2.5" fill="url(#accentGrad)" />

  <!-- Subtitle Text -->
  <text x="60" y="192" class="subtitle">Secure Enterprise Browsers, Remote Browser Isolation (RBI) &amp; Zero-Trust Access</text>

  <!-- Feature Pills / Badges Bar (Foreground) -->
  <g transform="translate(60, 235)">
    <!-- Pill 1 -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="180" height="36" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="1" filter="url(#shadow)" />
      <text x="18" y="23" class="badge-text">🛡️ DLP &amp; Session Control</text>
    </g>

    <!-- Pill 2 -->
    <g transform="translate(195, 0)">
      <rect x="0" y="0" width="180" height="36" rx="8" fill="#1e293b" stroke="#8b5cf6" stroke-width="1" filter="url(#shadow)" />
      <text x="18" y="23" class="badge-text">🔒 Browser Isolation (RBI)</text>
    </g>

    <!-- Pill 3 -->
    <g transform="translate(390, 0)">
      <rect x="0" y="0" width="160" height="36" rx="8" fill="#1e293b" stroke="#ec4899" stroke-width="1" filter="url(#shadow)" />
      <text x="18" y="23" class="badge-text">🌐 Zero-Trust Access</text>
    </g>

    <!-- Pill 4 -->
    <g transform="translate(565, 0)">
      <rect x="0" y="0" width="165" height="36" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1" filter="url(#shadow)" />
      <text x="18" y="23" class="badge-text">💻 BYOD Protection</text>
    </g>
  </g>
</svg>
